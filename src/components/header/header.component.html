<header class="relative flex flex-col md:flex-row items-center justify-center gap-6 mb-10 flex-shrink-0 w-full max-w-5xl mx-auto z-0">

  <!-- Logo Section -->
  <div 
    (click)="clear()"
    class="relative group shrink-0 cursor-pointer"
    title="Go Home"
  >
    <div class="absolute -inset-1 bg-gradient-to-r from-red-600 to-purple-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
    <!-- Replace the src below with your uploaded image URL -->
    <img 
      src="icon.svg" 
      alt="YouTube Notetaker Logo" 
      class="relative w-20 h-20 sm:w-24 sm:h-24 object-contain filter drop-shadow-2xl transform group-hover:scale-105 transition-transform duration-300 bg-gray-900 rounded-xl p-2 border border-gray-800"
    >
  </div>

  <!-- Text Section -->
  <div class="text-center md:text-left z-10">
    <h1 
      (click)="clear()"
      class="text-4xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-gray-200 tracking-tight drop-shadow-sm cursor-pointer hover:opacity-80 transition-opacity"
    >
      YouTube AI Notes
    </h1>
    <p class="mt-2 text-lg text-gray-400 font-medium tracking-wide">Watch, summarize, and chat with AI about YouTube videos. All in one place.</p>
  </div>

  <!-- Settings Icon Button (Absolute positioning relative to header container) -->
  <div class="absolute top-0 right-0 md:top-1/2 md:-translate-y-1/2 md:-right-16 z-20">
    <button 
      (click)="openSettings.emit()"
      class="p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-full transition-all focus:outline-none focus:ring-2 focus:ring-purple-500 shadow-sm"
      title="Settings"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>
  </div>
</header>

<!-- URL / Search Input -->
<div #searchBox class="relative mb-8 flex-shrink-0 w-full max-w-4xl mx-auto z-[70]">
  <div class="relative">
    <!-- Simple search -->
    <button
      type="button"
      (click)="submitSimpleSearch()"
      class="absolute inset-y-0 left-0 pl-4 pr-2 flex items-center text-gray-500 hover:text-white focus:outline-none focus:text-white transition-colors z-10"
      title="Search videos"
      aria-label="Search videos"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </button>
    <input 
      type="text" 
      [value]="text()"
      (input)="onInput($event)"
      (keydown.enter)="submitSimpleSearch()"
      placeholder="Paste a YouTube link or search videos..." 
      class="w-full bg-gray-800/80 backdrop-blur-sm border-2 border-gray-700 focus:ring-2 focus:ring-red-500 focus:border-red-500 rounded-xl py-4 pl-14 pr-24 text-white placeholder-gray-500 transition-all duration-200 shadow-lg text-lg relative z-0"
    >
    <div class="absolute inset-y-0 right-0 pr-3 flex items-center gap-1 z-10">
      @if (text() || searchFilters()) {
        <button 
          type="button"
          (click)="clear()"
          class="p-1 text-gray-500 hover:text-white focus:outline-none focus:text-white transition-colors"
          title="Clear"
          aria-label="Clear"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
          </svg>
        </button>
      }
      <!-- Advanced search -->
      <button
        type="button"
        (click)="isAdvancedOpen.set(!isAdvancedOpen())"
        class="p-1.5 rounded-full transition-colors focus:outline-none"
        [ngClass]="isAdvancedOpen() ? 'text-white bg-gray-700' : 'text-gray-500 hover:text-white focus:text-white'"
        title="Advanced search"
        aria-label="Advanced search"
        [attr.aria-expanded]="isAdvancedOpen()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z" />
        </svg>
      </button>
    </div>
  </div>

  @if (isAdvancedOpen()) {
    <div class="absolute left-0 right-0 top-full mt-2">
      <app-advanced-search
        [filters]="searchFilters()"
        [text]="text()"
        (search)="submitAdvancedSearch($event)"
        (close)="isAdvancedOpen.set(false)"
      ></app-advanced-search>
    </div>
  }
</div>

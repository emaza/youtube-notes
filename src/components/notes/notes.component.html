<div 
  cdkDrag
  [appPersistPanel]="'notes:' + layout()"
  cdkDragBoundary="body"
  class="bg-gray-800/80 backdrop-blur-md rounded-xl shadow-2xl ring-1 ring-white/10 flex flex-col group hover:shadow-green-500/20 resize overflow-hidden w-full h-full relative z-50 min-w-[min(20rem,100%)] min-h-[49px] sm:min-h-[61px]"
>
  <!-- Header (Drag Handle) -->
  <div cdkDragHandle class="p-3 sm:p-4 bg-gray-900/90 flex items-center justify-between shrink-0 border-b border-gray-700 select-none cursor-move">
    <h2 class="font-bold text-base sm:text-lg text-white flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" />
      </svg>
      My Notes
    </h2>
    <div class="flex items-center gap-2 shrink-0">
        <app-speech-controls [owner]="this" [text]="notes()" [language]="language()" label="Escuchar notas" [disabled]="!notes().trim()" />
        <button
          (click)="formatted.set(!formatted())"
          (pointerdown)="$event.stopPropagation()"
          class="text-xs text-gray-400 hover:text-white transition-colors px-2 py-1 rounded hover:bg-gray-700/70 cursor-pointer"
        >
          {{ formatted() ? 'Ver Markdown' : 'Formatear respuesta' }}
        </button>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500 hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
    </div>
  </div>

  <!-- Notes Content -->
  <div class="flex-grow flex flex-col bg-gray-900/40 relative min-h-0">
    @if (formatted()) {
      <div [innerHTML]="toHtml(notes())" class="markdown-body w-full h-full overflow-y-auto p-4 text-gray-200 select-text"></div>
    } @else {
    <textarea
      [value]="notes()"
      (input)="onNotesInput($event)"
      placeholder="Type your thoughts here..."
      class="w-full h-full bg-transparent border-none focus:ring-0 p-4 text-gray-200 placeholder-gray-500 resize-none text-base leading-relaxed selection:bg-green-500/30 outline-none"
    ></textarea>
    }
  </div>

  <!-- Footer Resize Handle -->
  <div class="h-6 bg-gray-900/90 border-t border-gray-700 shrink-0 flex justify-end items-center px-2 cursor-nwse-resize select-none hidden lg:flex">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500 opacity-80" viewBox="0 0 20 20" fill="currentColor">
        <path d="M16 16L10 10M16 12V16H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
  </div>
</div>
